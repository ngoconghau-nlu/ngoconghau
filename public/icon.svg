<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.04" />

  <!-- Shield Badge Outline -->
  <g filter="url(#shadow)">
    <!-- Shield / Emblem Path -->
    <path d="M 256 80 
             L 370 130 
             C 370 260 256 360 256 390 
             C 256 360 142 260 142 130 
             Z" 
          fill="url(#badgeGrad)" stroke="#34d399" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Inner Emblem Accent -->
    <path d="M 256 106 
             L 348 148 
             C 348 250 256 336 256 364 
             C 256 336 164 250 164 148 
             Z" 
          fill="#064e3b" fill-opacity="0.55" />

    <!-- Center Torch / Flame or Youth Star -->
    <!-- Star -->
    <polygon points="256,155 272,204 324,204 282,234 298,284 256,254 214,284 230,234 188,204 240,204" 
             fill="url(#starGrad)" stroke="#fef08a" stroke-width="3" />

    <!-- Open Book / Wings underneath star representing Education & Youth -->
    <path d="M 200 300 Q 256 280 256 325 Q 256 280 312 300 C 300 320 270 330 256 332 C 242 330 212 320 200 300 Z" 
          fill="#ffffff" />
  </g>

  <!-- Text Badge: NLU YOUTH -->
  <text x="256" y="440" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="4" 
        fill="#f8fafc">
    NLU YOUTH
  </text>
  <text x="256" y="470" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="16" 
        letter-spacing="2" 
        fill="#a7f3d0">
    ĐOÀN - HỘI NLU
  </text>
</svg>
